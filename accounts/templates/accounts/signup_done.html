{% extends "base.html" %}
{% block title %}인증 메일 발송{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card" style="text-align:center">
  <div style="font-size:2.4rem">✉️</div>
  <h1>메일을 확인해주세요</h1>
  <p><b>{{ email }}</b> 로 인증 링크를 보냈어요.<br>링크를 누르면 가입이 완료돼요. (24시간 유효)</p>
  <p class="muted">메일이 안 보이면 스팸함을 확인하거나 <a href="{% url 'accounts:resend_activation' %}"><b>인증 메일 다시 받기</b></a></p>
</div>
{% endblock %}
