{% extends "base.html" %}
{% block title %}비밀번호 재설정{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>비밀번호 재설정</h1>
  <p class="muted">가입한 이메일을 입력하면 재설정 링크를 보내드려요.</p>
  <form method="post">{% csrf_token %}
    {% include "form_fields.html" %}
    <button class="btn" style="width:100%" type="submit">재설정 메일 보내기</button>
  </form>
  <p class="muted" style="text-align:center;margin-top:16px"><a href="{% url 'accounts:login' %}">로그인으로 돌아가기</a></p>
</div>
{% endblock %}
