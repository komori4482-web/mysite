{% extends "base.html" %}
{% block title %}새 비밀번호 설정{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  {% if validlink %}
  <h1>새 비밀번호 설정</h1>
  <form method="post">{% csrf_token %}
    {% include "form_fields.html" %}
    <button class="btn" style="width:100%" type="submit">변경하기</button>
  </form>
  {% else %}
  <h1>링크를 사용할 수 없어요</h1>
  <p>링크가 만료됐거나 이미 사용됐어요.</p>
  <a class="btn" href="{% url 'accounts:password_reset' %}">재설정 메일 다시 받기</a>
  {% endif %}
</div>
{% endblock %}
