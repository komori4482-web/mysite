{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>회원가입</h1>
  <form method="post">{% csrf_token %}
    {% include "form_fields.html" %}
    <button class="btn" style="width:100%" type="submit">가입하기</button>
  </form>
  <p class="muted" style="text-align:center;margin-top:16px">이미 계정이 있나요? <a href="{% url 'accounts:login' %}"><b>로그인</b></a></p>
  <p class="muted" style="text-align:center;margin-top:4px;font-size:.78rem"><a href="{% url 'admin:index' %}">혹시 관리자이신가요?</a></p>
</div>
{% endblock %}
