{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>비밀번호 변경</h1>
  <form method="post">{% csrf_token %}
    {% include "form_fields.html" %}
    <div class="row">
      <button class="btn" type="submit">변경</button>
      <a class="btn ghost" href="{% url 'accounts:profile_detail' %}">취소</a>
    </div>
  </form>
</div>
{% endblock %}
