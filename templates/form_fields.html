{% if form.non_field_errors %}<div class="alert error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}
  </div>
{% endfor %}
