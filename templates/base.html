<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio Board{% endblock %}</title>
  <style>
    :root{--bg:#f7f8fa;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent-d:#4338ca;--danger:#dc2626;--r:12px}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e8eaf0;--muted:#9aa3b2;--line:#272b35;--accent:#818cf8;--accent-d:#6366f1;--danger:#f87171}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif;line-height:1.6}
    a{color:inherit;text-decoration:none}
    .nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .nav-in{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
    .logo{font-weight:700;font-size:1.1rem;color:var(--accent);margin-right:auto}
    .nav a:not(.logo){color:var(--muted);font-size:.92rem}
    .nav a:not(.logo):hover,.nav .link-btn:hover{color:var(--text)}
    .nav .link-btn{font-size:.92rem}
    .container{max-width:1000px;margin:32px auto;padding:0 20px}
    .narrow{max-width:440px}.mid{max-width:720px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
    h1{font-size:1.6rem;margin:0 0 20px}h2{font-size:1.15rem;margin:0 0 14px}
    .muted{color:var(--muted);font-size:.88rem}
    .btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.92rem;cursor:pointer;font-family:inherit}
    .btn:hover{background:var(--accent-d)}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    .btn.ghost:hover{background:var(--bg)}
    .btn.danger{background:var(--danger)}
    .btn.sm{padding:6px 12px;font-size:.82rem}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .between{justify-content:space-between}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px}
    .field input:not([type=checkbox]):not([type=file]),.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
    .field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
    .field textarea{min-height:200px;resize:vertical}
    .help{font-size:.8rem;color:var(--muted);margin-top:4px}
    .help ul{margin:4px 0 0;padding-left:18px}
    .errors{color:var(--danger);font-size:.84rem;margin-top:4px}
    .alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);font-size:.92rem}
    .alert.error{border-color:var(--danger);color:var(--danger)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .post-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
    .post-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
    .thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--accent),#a78bfa);overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb img+img{display:none}
    .post-body{padding:16px 18px}
    .post-body h3{margin:0 0 6px;font-size:1.05rem}
    .gallery{display:grid;gap:12px;margin:20px 0}
    .gallery:empty,.files:empty{display:none}
    .gallery img{width:100%;border-radius:var(--r);cursor:zoom-in;display:block}
    .files{list-style:none;padding:0;margin:12px 0}
    .files a{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:8px;font-size:.9rem}
    .files a:hover{background:var(--bg)}
    .content{white-space:pre-wrap;margin:20px 0}
    .comment{padding:14px 0;border-top:1px solid var(--line)}
    .comment:first-of-type{border-top:0}
    .link-btn{background:none;border:0;cursor:pointer;font:inherit;font-size:.88rem;padding:0;color:var(--muted)}
    .pager{display:flex;justify-content:center;gap:16px;margin-top:28px;align-items:center}
    .empty{text-align:center;padding:60px 0;color:var(--muted)}
    .avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.8rem;font-weight:700;flex-shrink:0}
    .previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .previews img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
    .previews span{font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
    .zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:50;cursor:zoom-out}
    .zoom img{max-width:92vw;max-height:92vh;border-radius:8px}
    form.inline{display:inline}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-in">
    <a href="{% url 'boards:post_list' %}" class="logo">◆ Portfolio Board</a>
    {% if user.is_authenticated %}
      <a href="{% url 'boards:post_create' %}">글쓰기</a>
      <a href="{% url 'accounts:profile_detail' %}">{{ user.profile.nickname|default:user.email }}</a>
      <form class="inline" method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="link-btn" type="submit">로그아웃</button></form>
    {% else %}
      <a href="{% url 'accounts:login' %}">로그인</a>
      <a href="{% url 'accounts:signup' %}">회원가입</a>
    {% endif %}
  </div></nav>
  <main class="container {% block width %}{% endblock %}">
    {% if messages %}{% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // 이미지 클릭 시 확대 / 다시 클릭하면 닫기
    document.querySelectorAll('img[data-zoom]').forEach(function (img) {
      img.addEventListener('click', function () {
        var o = document.createElement('div');
        o.className = 'zoom';
        o.innerHTML = '<img src="' + img.src + '" alt="">';
        o.addEventListener('click', function () { o.remove(); });
        document.body.appendChild(o);
      });
    });
    // data-confirm 속성이 있는 폼은 제출 전에 확인
    document.querySelectorAll('form[data-confirm]').forEach(function (f) {
      f.addEventListener('submit', function (e) {
        if (!confirm(f.dataset.confirm)) e.preventDefault();
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
